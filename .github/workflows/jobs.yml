name: Profesia job alerts

on:
  schedule:
    - cron: "7,37 * * * *"   # каждые 30 минут (не ровно в :00 — меньше задержек), время UTC
  workflow_dispatch:

# Разрешение коммитить seen_jobs.json обратно в репозиторий
permissions:
  contents: write

# Не запускать два раза одновременно — иначе конфликт при push
concurrency:
  group: profesia-job-alerts
  cancel-in-progress: false

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run job checker
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python profesia_telegram_bot.py

      # Сохраняем список отправленных вакансий даже если скрипт упал на середине,
      # чтобы уже отправленные не пришли повторно
      - name: Save seen jobs
        if: success() || failure()
        run: |
          [ -f seen_jobs.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git commit -m "Update seen jobs [skip ci]"
          git pull --rebase
          git push
